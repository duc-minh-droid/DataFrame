<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .t { fill: #16191d; font-size: 13px; }
    .h { fill: #16191d; font-size: 15px; font-weight: 700; }
    .m { fill: #5b6270; font-size: 11.5px; }
    .mono { font-family: ui-monospace, Consolas, Menlo, monospace; }
    .box { fill: #f5f6f8; stroke: #cfd4dc; stroke-width: 1.2; }
    .cell { fill: #e8eefb; stroke: #9db5e6; stroke-width: 1; }
    .cellc { fill: #fdebe2; stroke: #e9a27f; stroke-width: 1; }
    .cellv { fill: #e3f5ed; stroke: #7cc7a4; stroke-width: 1; }
    .dim { opacity: .35; }
    .ptr { stroke: #2a78d6; stroke-width: 1.6; fill: none; }
    .ptrg { stroke: #1a9e6c; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .ah { fill: #2a78d6; }
    .ahg { fill: #1a9e6c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1319; }
      .t, .h { fill: #e7eaf0; }
      .m { fill: #98a2b3; }
      .box { fill: #161b23; stroke: #313a48; }
      .cell { fill: #1b2a44; stroke: #3d6ab3; }
      .cellc { fill: #3a2419; stroke: #b0643f; }
      .cellv { fill: #16332a; stroke: #2e8a64; }
      .ptr { stroke: #5aa2f0; }
      .ah { fill: #5aa2f0; }
      .ptrg { stroke: #3cc48f; }
      .ahg { fill: #3cc48f; }
    }
  </style>
  <rect class="bg" width="920" height="470" rx="14"/>

  <text class="h" x="28" y="36">DataFrame: one contiguous vector&lt;double&gt; per column</text>
  <text class="m" x="28" y="55">Rows are never stored together. Text columns hold dictionary codes (sorted labels, so code order = alphabetical order).</text>

  <!-- storage -->
  <rect class="box" x="28" y="70" width="520" height="190" rx="10"/>
  <text class="t mono" x="44" y="95">columns_[0]  "region"  (cat)</text>
  <g transform="translate(44,104)">
    <rect class="cellc" x="0" width="36" height="24" rx="3"/><rect class="cellc" x="40" width="36" height="24" rx="3"/><rect class="cellc" x="80" width="36" height="24" rx="3"/><rect class="cellc" x="120" width="36" height="24" rx="3"/><rect class="cellc" x="160" width="36" height="24" rx="3"/><rect class="cellc" x="200" width="36" height="24" rx="3"/>
    <text class="t mono" x="13" y="16">0</text><text class="t mono" x="53" y="16">1</text><text class="t mono" x="93" y="16">2</text><text class="t mono" x="133" y="16">2</text><text class="t mono" x="173" y="16">1</text><text class="t mono" x="213" y="16">3</text>
    <text class="m mono" x="252" y="16">labels_[0] = {East, North, South, West}</text>
  </g>
  <text class="t mono" x="44" y="155">columns_[1]  "units"   (f64)</text>
  <g transform="translate(44,164)">
    <rect class="cell" x="0" width="36" height="24" rx="3"/><rect class="cell" x="40" width="36" height="24" rx="3"/><rect class="cell" x="80" width="36" height="24" rx="3"/><rect class="cell" x="120" width="36" height="24" rx="3"/><rect class="cell" x="160" width="36" height="24" rx="3"/><rect class="cell" x="200" width="36" height="24" rx="3"/>
    <text class="t mono" x="13" y="16">7</text><text class="t mono" x="49" y="16">10</text><text class="t mono" x="93" y="16">2</text><text class="t mono" x="133" y="16">9</text><text class="t mono" x="169" y="16">11</text><text class="t mono" x="213" y="16">4</text>
  </g>
  <text class="t mono" x="44" y="215">columns_[2]  "price"   (f64)</text>
  <g transform="translate(44,224)">
    <rect class="cell" x="0" width="36" height="24" rx="3"/><rect class="cell" x="40" width="36" height="24" rx="3"/><rect class="cell" x="80" width="36" height="24" rx="3"/><rect class="cell" x="120" width="36" height="24" rx="3"/><rect class="cell" x="160" width="36" height="24" rx="3"/><rect class="cell" x="200" width="36" height="24" rx="3"/>
    <text class="m mono" x="4" y="16">25.9</text><text class="m mono" x="47" y="16">7.62</text><text class="m mono" x="84" y="16">12.5</text><text class="m mono" x="124" y="16">12.5</text><text class="m mono" x="164" y="16">25.7</text><text class="m mono" x="204" y="16">10.8</text>
  </g>
  <text class="m mono" x="300" y="243">row r = columns_[c][r]</text>
  <g class="m mono"><text x="57" y="275">0</text><text x="97" y="275">1</text><text x="137" y="275">2</text><text x="177" y="275">3</text><text x="217" y="275">4</text><text x="257" y="275">5</text></g>

  <!-- view -->
  <text class="h" x="600" y="98">DataFrameView (zero-copy)</text>
  <rect class="box" x="600" y="110" width="292" height="150" rx="10"/>
  <text class="t mono" x="616" y="135">df_  (const DataFrame*)</text>
  <text class="t mono" x="616" y="170">column_indices_</text>
  <g transform="translate(616,178)"><rect class="cellv" width="30" height="22" rx="3"/><rect class="cellv" x="34" width="30" height="22" rx="3"/><text class="t mono" x="11" y="15">0</text><text class="t mono" x="45" y="15">2</text></g>
  <text class="t mono" x="616" y="222">row_indices_</text>
  <g transform="translate(616,230)"><rect class="cellv" width="30" height="22" rx="3"/><rect class="cellv" x="34" width="30" height="22" rx="3"/><rect class="cellv" x="68" width="30" height="22" rx="3"/><text class="t mono" x="11" y="15">4</text><text class="t mono" x="45" y="15">0</text><text class="t mono" x="79" y="15">3</text></g>
  <text class="m" x="720" y="246">after filter + sort</text>
  <path class="ptr" d="M608 130 C 585 130, 575 118, 552 118"/>
  <path class="ah" d="M549 118 l10 -5 v10 z"/>
  <path class="ptrg" d="M631 252 C 560 300, 300 300, 222 280"/>
  <path class="ahg" d="M218 278 l11 -3 l-4 10 z"/>

  <!-- ops table -->
  <text class="h" x="28" y="318">What each operation touches</text>
  <g transform="translate(28,332)">
    <rect class="box" width="864" height="116" rx="10"/>
    <text class="t mono" x="16" y="26">select(cols)</text><text class="m" x="160" y="26">rewrites column_indices_ only</text>
    <text class="t mono" x="16" y="48">filter(col, pred)</text><text class="m" x="160" y="48">keeps passing positions of row_indices_</text>
    <text class="t mono" x="16" y="70">sort(col, asc)</text><text class="m" x="160" y="70">stable_sort of a copy of row_indices_</text>
    <text class="t mono" x="16" y="92">head(n)</text><text class="m" x="160" y="92">truncates row_indices_</text>
    <text class="t mono" x="470" y="26">groupby(key).agg(...)</text><text class="m" x="640" y="26">hash buckets → new DataFrame</text>
    <text class="t mono" x="470" y="48">join(right, key)</text><text class="m" x="640" y="48">hash build + probe → new DataFrame</text>
    <text class="t mono" x="470" y="70">describe()</text><text class="m" x="640" y="70">gather, sort once → new DataFrame</text>
    <text class="t mono" x="470" y="92">materialize()</text><text class="m" x="640" y="92">copy the visible cells out</text>
  </g>
</svg>
